#:schema node_modules/wrangler/config-schema.json
# ============================================================================
#  DiskDash — Cloudflare Worker 配置
#  部署前请把所有 YOUR_... 占位符替换为真实值。
#  敏感信息（Token / Key）请勿写在本文件，使用：
#    npx wrangler secret put IMGHUB_API_KEY
#    npx wrangler secret put OPENLIST_TOKEN
# ============================================================================

name = "diskdash-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ---- 定时任务：每天 UTC 03:00 抓取一次（cron 使用 UTC 时区）----
[triggers]
crons = ["0 3 * * *"]

# ---- 可观测性（可选）----
[observability]
enabled = true

# ---- KV：保存最近一次抓取的 stats_data ----
# 先执行：npx wrangler kv namespace create STATS_KV
[[kv_namespaces]]
binding = "STATS_KV"
id = "b4604705200f4a88b7cb09b9a1beb8ad"
preview_id = "7e3f92715c0a4c8c989c988ed07a4f10"

# ============================================================================
#  非敏感配置（vars）
# ============================================================================
[vars]
# 【必填】允许跨域访问的 Pages 源。可写多个，用英文逗号分隔，不要带结尾斜杠。
# 例如："https://diskdash.pages.dev,https://disk.example.com"
ALLOWED_ORIGIN = "https://zarijaden.cc.cd,https://diskdash.pages.dev"

# ---------------------------------------------------------------------------
# 1) R2 用量（自家用量接口，一次返回存储 + 操作）
# ---------------------------------------------------------------------------
# 用量接口地址
R2_USAGE_API_URL = "https://r2usage.zpbk.cc.cd/api"
# 兜底总配额：接口没返回 totalBytes 时用它算百分比。支持 "100GB" / 纯字节数。
R2_TOTAL_CAPACITY = "10GB"
# 每月免费额度（接口只给已用量，额度在这里配；Class A 默认 100 万，Class B 默认 1000 万）
R2_CLASS_A_LIMIT = "1000000"
R2_CLASS_B_LIMIT = "10000000"

# ---------------------------------------------------------------------------
# 2) ImgHub / Infinicloud —— 走 ImgHub 管理 API，按渠道读已用容量
# ---------------------------------------------------------------------------
# ImgHub 实例根地址（管理 API 基址）
IMGHUB_API_BASE = "https://zpbk.cc.cd"
# InfiniCLOUD 在图床里的渠道名（ChannelName），对应 metadata.channelStats 的 key
IMGHUB_CHANNEL = "infinicloud"
# 兜底总配额：ImgHub 渠道未配置 quota.limitGB 时使用，支持 "20GB" / 字节数；留空则只显示已用
INFINICLOUD_TOTAL_CAPACITY = ""
# ImgHub 后台地址，/api/proxy/imghub 代理跳转的目标
IMGHUB_PROXY_URL = "https://zpbk.cc.cd/dashboard"

# ---------------------------------------------------------------------------
# 3) OpenList
# ---------------------------------------------------------------------------
OPENLIST_BASE_URL = "https://zpfl.cc.cd"
# proxy = Worker 反向代理并注入 Token（默认）；redirect = 直接 302 到真实后台
OPENLIST_PROXY_MODE = "proxy"

[observability.logs]
enabled = true
invocation_logs = true

[previews.vars]
ALLOWED_ORIGIN = "https://zarijaden.cc.cd,https://diskdash.pages.dev"
IMGHUB_API_BASE = "https://zpbk.cc.cd"
IMGHUB_CHANNEL = "infinicloud"
IMGHUB_PROXY_URL = "https://zpbk.cc.cd/dashboard"
INFINICLOUD_TOTAL_CAPACITY = ""
OPENLIST_BASE_URL = "https://zpfl.cc.cd"
OPENLIST_PROXY_MODE = "proxy"
R2_CLASS_A_LIMIT = "1000000"
R2_CLASS_B_LIMIT = "10000000"
R2_TOTAL_CAPACITY = "10GB"
R2_USAGE_API_URL = "https://r2usage.zpbk.cc.cd/api"
